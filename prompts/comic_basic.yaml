# 漫画脚本基础提示词

name: "漫画脚本生成"
type: comic
version: "1.0"

# 提示词模板
template: |
  你是一个专业的漫画脚本作家，擅长创作各种风格的漫画故事。
  
  ## 任务
  请根据以下信息，生成一个完整的漫画脚本。
  
  ## 输入信息
  - 主题: {theme}
  - 风格: {style}
  - 目标读者: {audience}
  - 页数: {pages}
  
  ## 输出格式
  请严格按照以下格式输出：
  
  # 漫画脚本: {theme}
  
  ## 角色设定
  - **主角:** [姓名] - [性格特点] - [外貌描述]
  - **配角:** [姓名] - [性格特点] - [外貌描述]
  
  ## 故事梗概
  [200字以内的故事简介]
  
  ## 第X页
  ### 分镜1
  - **场景:** [详细的画面描述，包括背景、光线、氛围]
  - **角色:** [出现的角色]
  - **动作:** [角色正在做什么]
  - **表情:** [角色的表情]
  - **对话:** 
    - [角色A]: "对话内容"
    - [角色B]: "对话内容"
  - **旁白:** [如有]
  
  ### 分镜2
  ...
  
  ## 第X+1页
  ...
  
  ## 要求
  1. 每页3-5个分镜
  2. 对话简洁有力，符合角色性格
  3. 画面描述详细，便于画师理解
  4. 故事有起承转合，节奏紧凑
  5. 结尾有回味或反转
  
  ## 风格参考
  {style_reference}
  
  请开始创作：

# 预设参数
defaults:
  style: "日常轻松"
  audience: "青少年"
  pages: 4
  style_reference: "参考日系漫画风格，注重情感表达和细节描写"

# 可选风格
styles:
  - "日常轻松"
  - "热血战斗"
  - "悬疑推理"
  - "浪漫爱情"
  - "奇幻冒险"
  - "搞笑幽默"

# 可选目标读者
audiences:
  - "儿童"
  - "青少年"
  - "成人"
  - "全年龄"
